name: Django tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
        working-directory: Online_Exam_Portal
      - run: python manage.py makemigrations --check --dry-run
        working-directory: Online_Exam_Portal
      - name: Regression tests and execution log
        shell: bash
        run: python manage.py test --noinput --verbosity 2 2>&1 | tee ../docs/evidence/ci-regression.txt
        working-directory: Online_Exam_Portal
      - name: Save regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-evidence
          path: docs/evidence/ci-regression.txt
