{% extends "base.html" %}
{% block title %}Delete MCQ{% endblock %}
{% block content %}
<div class="panel form-card">
    <h1 class="page-title">Delete question?</h1>
    <p>{{ question.text }}</p>
    <p class="help">This cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn-primary" style="background: var(--danger);">Confirm delete</button>
        <a href="{% url 'exams:questions' exam.id %}">Cancel</a>
    </form>
</div>
{% endblock %}
