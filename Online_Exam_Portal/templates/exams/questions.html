<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>MCQs — {{ exam.title }}</title>
<style>body{font:16px system-ui;margin:3rem auto;max-width:900px;color:#1e293b;padding:0 1rem}a{color:#047857}table{width:100%;border-collapse:collapse}td,th{padding:.8rem;text-align:left;border-bottom:1px solid #ddd}button{cursor:pointer}</style>
</head><body>
<h1>MCQ questions: {{ exam.title }}</h1>
<p><a href="{% url 'accounts:admin_dashboard' %}">Admin dashboard</a> · <a href="{% url 'exams:question_create' exam.id %}">+ Add question</a></p>
{% if questions %}<table><tr><th>Question</th><th>Correct choice</th><th>Actions</th></tr>
{% for q in questions %}<tr><td>{{ q.text }}</td><td>{{ q.correct_option }}</td><td>
<a href="{% url 'exams:question_edit' exam.id q.id %}">Edit</a> · <a href="{% url 'exams:question_delete' exam.id q.id %}">Delete</a></td></tr>{% endfor %}</table>
{% else %}<p>No questions yet. Add the first MCQ.</p>{% endif %}</body></html>
